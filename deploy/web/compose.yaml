name: hpclaw-web
services:
  hpclaw:
    build: .
    image: hpclaw-web:0.4.41
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${HPCLAW_BIND_IP:-127.0.0.1}:${HPCLAW_PORT:-3003}:3003"
    environment:
      HPCLAW_WEB_ORIGIN: "${HPCLAW_WEB_ORIGIN:-http://127.0.0.1:3003}"
      HPCLAW_WEB_COOKIE_SECURE: "${HPCLAW_WEB_COOKIE_SECURE:-0}"
      HPCLAW_TRUST_PROXY: "${HPCLAW_TRUST_PROXY:-0}"
    volumes:
      - hpclaw-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hpclaw-data:
