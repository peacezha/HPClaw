name: Package public web Node 20 compatibility
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Add the new public web package without replacing existing installers
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hpclaw-public-web
  cancel-in-progress: false
jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.5, 22.17.1]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Read package version
        run: node -e "console.log('HPCLAW_PACKAGE_VERSION=' + require('./package.json').version)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/check-public-web-runtime.mjs
      - run: npm run web:build
      - run: node scripts/build-public-web-package.mjs
      - name: Install packaged runtime dependencies
        run: cd release-public-web/HPClaw-${{ env.HPCLAW_PACKAGE_VERSION }}-public-web-linux-x64-node20 && npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify actual deployment launcher
        run: node scripts/smoke-public-web-start.mjs release-public-web/HPClaw-${{ env.HPCLAW_PACKAGE_VERSION }}-public-web-linux-x64-node20
      - name: Create isolated real SSH fixture
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y openssh-server
          fi
          node scripts/setup-public-web-smoke.mjs
      - name: Verify packaged workers with two real SSH accounts
        run: npx tsx scripts/smoke-public-web.ts release-public-web/HPClaw-${{ env.HPCLAW_PACKAGE_VERSION }}-public-web-linux-x64-node20
      - uses: actions/upload-artifact@v4
        if: matrix.node == '20.19.5'
        with:
          name: public-web-linux-x64
          path: |
            release-public-web/*.tar.gz
            release-public-web/*.sha256
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: web
    if: inputs.publish
    concurrency:
      group: hpclaw-release-assets-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - uses: actions/download-artifact@v4
        with:
          name: public-web-linux-x64
          path: public-web-artifacts
      - run: node scripts/publish-public-web-assets.mjs public-web-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
