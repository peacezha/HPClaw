<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="areaR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="areaR2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#1a1c21"/>
  <text x="40" y="42" font-size="20" font-weight="600" fill="#e5e7eb">Per-cycle QC Quality Curve</text>
  <text x="40" y="64" font-size="13" fill="#8b93a3">Mean Q-score across sequencing cycles (Read 1 / Read 2)</text>

  <!-- legend -->
  <line x1="660" y1="34" x2="684" y2="34" stroke="#2dd4bf" stroke-width="3"/>
  <text x="690" y="38" font-size="13" fill="#c9cfdb">Read 1</text>
  <line x1="752" y1="34" x2="776" y2="34" stroke="#fbbf24" stroke-width="3"/>
  <text x="782" y="38" font-size="13" fill="#c9cfdb">Read 2</text>

  <!-- horizontal gridlines: Q40..Q20 → y = 346 - (Q-20)*13.4 -->
  <g stroke="#2a2e36" stroke-width="1">
    <line x1="80" y1="346" x2="860" y2="346"/>
    <line x1="80" y1="279" x2="860" y2="279"/>
    <line x1="80" y1="212" x2="860" y2="212"/>
    <line x1="80" y1="145" x2="860" y2="145"/>
    <line x1="80" y1="78" x2="860" y2="78"/>
  </g>
  <!-- vertical gridlines: cycle 30/60/90/120 -->
  <g stroke="#242832" stroke-width="1" stroke-dasharray="3 4">
    <line x1="231.8" y1="78" x2="231.8" y2="346"/>
    <line x1="388.9" y1="78" x2="388.9" y2="346"/>
    <line x1="545.9" y1="78" x2="545.9" y2="346"/>
    <line x1="702.9" y1="78" x2="702.9" y2="346"/>
  </g>
  <g font-size="12" fill="#8b93a3" text-anchor="end">
    <text x="72" y="350">Q20</text>
    <text x="72" y="283">Q25</text>
    <text x="72" y="216">Q30</text>
    <text x="72" y="149">Q35</text>
    <text x="72" y="82">Q40</text>
  </g>
  <g font-size="12" fill="#8b93a3" text-anchor="middle">
    <text x="80" y="366">1</text>
    <text x="231.8" y="366">30</text>
    <text x="388.9" y="366">60</text>
    <text x="545.9" y="366">90</text>
    <text x="702.9" y="366">120</text>
    <text x="860" y="366">150</text>
  </g>
  <line x1="80" y1="78" x2="80" y2="346" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="80" y1="346" x2="860" y2="346" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Q26 threshold: y = 346 - 6*13.4 -->
  <line x1="80" y1="265.6" x2="860" y2="265.6" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="90" y="258" font-size="11" fill="#8b93a3">Q26 threshold</text>

  <!-- area fills (fade to transparent) -->
  <polygon fill="url(#areaR1)" points="80,346 80.0,111.8 106.2,120.0 132.3,125.7 158.5,127.6 184.7,125.4 210.9,120.1 237.0,113.9 263.2,109.2 289.4,108.0 315.6,111.4 341.7,118.9 367.9,129.1 394.1,139.7 420.3,148.4 446.4,153.3 472.6,153.8 498.8,150.8 525.0,146.0 551.1,142.0 577.3,140.8 603.5,143.9 629.7,151.4 655.8,162.2 682.0,174.1 708.2,184.6 734.4,191.8 760.5,194.7 786.7,193.6 812.9,190.1 839.1,186.5 839.1,346"/>
  <polygon fill="url(#areaR2)" points="80,346 80.0,139.5 106.2,141.0 132.3,135.0 158.5,124.7 184.7,116.0 210.9,114.1 237.0,121.0 263.2,134.5 289.4,149.5 315.6,160.1 341.7,162.8 367.9,157.9 394.1,149.7 420.3,144.2 446.4,146.0 472.6,156.5 498.8,172.6 525.0,189.0 551.1,199.8 577.3,202.5 603.5,198.1 629.7,191.6 655.8,188.8 682.0,193.9 708.2,207.4 734.4,225.5 760.5,242.6 786.7,253.2 812.9,255.6 839.1,251.6 839.1,346"/>

  <!-- curves -->
  <polyline fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80.0,111.8 106.2,120.0 132.3,125.7 158.5,127.6 184.7,125.4 210.9,120.1 237.0,113.9 263.2,109.2 289.4,108.0 315.6,111.4 341.7,118.9 367.9,129.1 394.1,139.7 420.3,148.4 446.4,153.3 472.6,153.8 498.8,150.8 525.0,146.0 551.1,142.0 577.3,140.8 603.5,143.9 629.7,151.4 655.8,162.2 682.0,174.1 708.2,184.6 734.4,191.8 760.5,194.7 786.7,193.6 812.9,190.1 839.1,186.5"/>
  <polyline fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="80.0,139.5 106.2,141.0 132.3,135.0 158.5,124.7 184.7,116.0 210.9,114.1 237.0,121.0 263.2,134.5 289.4,149.5 315.6,160.1 341.7,162.8 367.9,157.9 394.1,149.7 420.3,144.2 446.4,146.0 472.6,156.5 498.8,172.6 525.0,189.0 551.1,199.8 577.3,202.5 603.5,198.1 629.7,191.6 655.8,188.8 682.0,193.9 708.2,207.4 734.4,225.5 760.5,242.6 786.7,253.2 812.9,255.6 839.1,251.6"/>

  <text x="470" y="394" font-size="12" fill="#6b7280" text-anchor="middle">cycle</text>
  <text x="30" y="212" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 30 212)">Q-score</text>
</svg>
